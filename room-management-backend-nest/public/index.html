<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Room Management System</h1>
            <nav>
                <button class="nav-btn active" onclick="showSection('dashboard')">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </button>
                <button class="nav-btn" onclick="showSection('rooms')">
                    <i class="fas fa-door-open"></i> Rooms
                </button>
                <button class="nav-btn" onclick="showSection('bookings')">
                    <i class="fas fa-calendar-check"></i> Bookings
                </button>
            </nav>
        </header>

        <main>
            <!-- Dashboard Section -->
            <section id="dashboard" class="section active">
                <div class="dashboard-header">
                    <h2>Dashboard Overview</h2>
                    <button class="btn btn-sm" onclick="updateRoomStatuses()" title="Refresh room statuses">
                        <i class="fas fa-sync-alt"></i> Refresh Status
                    </button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-door-open"></i>
                        <h3 id="total-rooms">-</h3>
                        <p>Total Rooms</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-calendar-check"></i>
                        <h3 id="active-bookings">-</h3>
                        <p>Active Bookings</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-check-circle"></i>
                        <h3 id="available-rooms">-</h3>
                        <p>Available Rooms</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-tools"></i>
                        <h3 id="maintenance-rooms">-</h3>
                        <p>Under Maintenance</p>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>Today's Bookings</h3>
                        <div id="today-bookings" class="booking-list"></div>
                    </div>
                    <div class="dashboard-card">
                        <h3>Room Status</h3>
                        <div id="room-status-chart" class="status-chart"></div>
                    </div>
                </div>
            </section>

            <!-- Rooms Section -->
            <section id="rooms" class="section">
                <div class="section-header">
                    <h2>Room Management</h2>
                    <button class="btn btn-primary" onclick="showAddRoomForm()">
                        <i class="fas fa-plus"></i> Add Room
                    </button>
                </div>
                
                <div class="filters">
                    <select id="floor-filter" onchange="filterRooms()">
                        <option value="">All Floors</option>
                    </select>
                    <select id="status-filter" onchange="filterRooms()">
                        <option value="">All Status</option>
                        <option value="FREE">Free</option>
                        <option value="BUSY">Busy</option>
                        <option value="MAINTENANCE">Maintenance</option>
                        <option value="RESERVED">Reserved</option>
                    </select>
                </div>

                <div id="rooms-list" class="rooms-grid"></div>
            </section>

            <!-- Bookings Section -->
            <section id="bookings" class="section">
                <div class="section-header">
                    <h2>Booking Management</h2>
                    <button class="btn btn-primary" onclick="showAddBookingForm()">
                        <i class="fas fa-plus"></i> New Booking
                    </button>
                </div>

                <div class="filters">
                    <input type="date" id="date-filter" onchange="filterBookings()">
                    <select id="booking-status-filter" onchange="filterBookings()">
                        <option value="">All Status</option>
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>

                <div id="bookings-list" class="bookings-list"></div>
            </section>
        </main>
    </div>

    <!-- Add Room Modal -->
    <div id="add-room-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('add-room-modal')">&times;</span>
            <h3>Add New Room</h3>
            <form id="add-room-form">
                <div class="form-group">
                    <label for="room-name">Room Name</label>
                    <input type="text" id="room-name" required>
                </div>
                <div class="form-group">
                    <label for="room-capacity">Capacity</label>
                    <input type="number" id="room-capacity" min="1" max="100" required>
                </div>
                <div class="form-group">
                    <label for="room-floor">Floor</label>
                    <select id="room-floor" required></select>
                </div>
                <div class="form-group">
                    <label for="room-description">Description</label>
                    <textarea id="room-description"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Room</button>
            </form>
        </div>
    </div>

    <!-- Add Booking Modal -->
    <div id="add-booking-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('add-booking-modal')">&times;</span>
            <h3>Create New Booking</h3>
            <form id="add-booking-form">
                <div class="form-group">
                    <label for="booking-room">Room</label>
                    <select id="booking-room" required></select>
                </div>
                <div class="form-group">
                    <label for="booking-user">User</label>
                    <input type="text" id="booking-user" required>
                </div>
                <div class="form-group">
                    <label for="booking-department">Department</label>
                    <select id="booking-department"></select>
                </div>
                <div class="form-group">
                    <label for="booking-purpose">Purpose</label>
                    <input type="text" id="booking-purpose">
                </div>
                <div class="form-group">
                    <label for="booking-start">Start Time</label>
                    <input type="datetime-local" id="booking-start" required>
                </div>
                <div class="form-group">
                    <label for="booking-end">End Time</label>
                    <input type="datetime-local" id="booking-end" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Booking</button>
            </form>
        </div>
    </div>

    <!-- Edit Room Modal -->
    <div id="edit-room-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('edit-room-modal')">&times;</span>
            <h3>Edit Room</h3>
            <form id="edit-room-form">
                <input type="hidden" id="edit-room-id">
                <div class="form-group">
                    <label for="edit-room-name">Room Name</label>
                    <input type="text" id="edit-room-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-room-capacity">Capacity</label>
                    <input type="number" id="edit-room-capacity" min="1" max="100" required>
                </div>
                <div class="form-group">
                    <label for="edit-room-floor">Floor</label>
                    <select id="edit-room-floor" required></select>
                </div>
                <div class="form-group">
                    <label for="edit-room-description">Description</label>
                    <textarea id="edit-room-description"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-room-status">Status</label>
                    <select id="edit-room-status">
                        <option value="FREE">Free</option>
                        <option value="BUSY">Busy</option>
                        <option value="MAINTENANCE">Maintenance</option>
                        <option value="RESERVED">Reserved</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Update Room</button>
            </form>
        </div>
    </div>

    <!-- Edit Booking Modal -->
    <div id="edit-booking-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('edit-booking-modal')">&times;</span>
            <h3>Edit Booking</h3>
            <form id="edit-booking-form">
                <input type="hidden" id="edit-booking-id">
                <div class="form-group">
                    <label for="edit-booking-room">Room</label>
                    <select id="edit-booking-room" required></select>
                </div>
                <div class="form-group">
                    <label for="edit-booking-user">User</label>
                    <input type="text" id="edit-booking-user" required>
                </div>
                <div class="form-group">
                    <label for="edit-booking-department">Department</label>
                    <select id="edit-booking-department"></select>
                </div>
                <div class="form-group">
                    <label for="edit-booking-purpose">Purpose</label>
                    <input type="text" id="edit-booking-purpose">
                </div>
                <div class="form-group">
                    <label for="edit-booking-start">Start Time</label>
                    <input type="datetime-local" id="edit-booking-start" required>
                </div>
                <div class="form-group">
                    <label for="edit-booking-end">End Time</label>
                    <input type="datetime-local" id="edit-booking-end" required>
                </div>
                <div class="form-group">
                    <label for="edit-booking-status">Status</label>
                    <select id="edit-booking-status">
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Update Booking</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
